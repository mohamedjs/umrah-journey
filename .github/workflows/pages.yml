name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build for GitHub Pages
        env:
          VITE_BASE: /umrah-journey/
        run: npm run build

      - name: Verify build integrity
        run: |
          set -euo pipefail
          required_files=(
            dist/index.html
            dist/sw.js
            dist/manifest.webmanifest
            dist/draco/draco_decoder.wasm
            dist/fonts/tajawal-arabic-700-normal.woff2
            dist/models/characters/agent.glb
            dist/models/characters/attendant.glb
            dist/models/characters/crowd.glb
            dist/models/characters/guide.glb
            dist/models/characters/mentor.glb
            dist/models/characters/player.glb
            dist/models/env/airport.glb
            dist/models/env/haram_mataf.glb
            dist/models/env/home.glb
            dist/models/env/kaaba.glb
            dist/models/env/makkah.glb
            dist/models/env/maqam.glb
            dist/models/env/masa.glb
            dist/models/env/plane.glb
          )
          for f in "${required_files[@]}"; do
            if [ ! -s "$f" ]; then
              echo "ERROR: Missing or empty required build artifact: $f" >&2
              exit 1
            fi
          done
          if grep -rn "url(/fonts" dist/assets/; then
            echo "ERROR: Root-absolute url(/fonts/ leaked into dist/assets/" >&2
            exit 1
          fi
          echo "All required build artifacts verified."

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
