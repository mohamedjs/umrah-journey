<!doctype html><html lang="ar"><head><meta charset="utf-8"><title>Umrah concept</title>
<style>
@font-face{font-family:Taj;src:url(fonts/tajawal-arabic-500-normal.woff2);font-weight:500}
@font-face{font-family:Taj;src:url(fonts/tajawal-arabic-700-normal.woff2);font-weight:700}
@font-face{font-family:Taj;src:url(fonts/tajawal-arabic-800-normal.woff2);font-weight:800}
@font-face{font-family:Taj;src:url(fonts/inter-latin-700-normal.woff2);font-weight:700;unicode-range:U+0000-00FF}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#000;font-family:Taj,sans-serif}
canvas{display:block}
#hud{position:absolute;inset:0;pointer-events:none;direction:rtl;color:#fff}
.obj{position:absolute;top:34px;right:40px;background:rgba(20,24,38,.72);border:1.5px solid rgba(255,214,140,.55);border-radius:22px;padding:16px 26px 18px;backdrop-filter:blur(6px);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.obj small{display:block;font:700 20px Taj;color:#ffd68c;margin-bottom:4px}
.obj b{font:800 32px Taj}
.chap{position:absolute;top:34px;left:40px;direction:rtl;background:rgba(255,255,255,.9);color:#3a2a14;border-radius:99px;padding:10px 26px 12px;font:800 26px Taj;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.dlg{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);width:1240px;padding-left:180px!important;background:rgba(255,250,240,.96);color:#2b2216;border-radius:28px;padding:24px 34px 28px;box-shadow:0 18px 50px rgba(0,0,0,.4);border:3px solid #e9c98f}
.dlg .who{position:absolute;top:-24px;right:40px;background:#c08a3e;color:#fff;font:800 24px Taj;padding:6px 22px 9px;border-radius:14px}
.dlg p{font:700 31px/1.6 Taj}
.dlg .nx{position:absolute;left:34px;bottom:26px;background:#f3e2c0;padding:4px 14px 7px;border-radius:10px;font:700 22px Taj;color:#b07a32}
.list{position:absolute;top:150px;right:40px;width:360px;background:rgba(20,24,38,.78);border-radius:22px;padding:20px 24px;border:1.5px solid rgba(255,255,255,.15)}
.list h4{font:800 24px Taj;color:#ffd68c;margin-bottom:10px}
.list div{font:700 23px/1.9 Taj;display:flex;gap:12px;align-items:center}
.ck{width:28px;height:28px;border-radius:8px;border:2.5px solid #ffd68c;display:inline-flex;align-items:center;justify-content:center;font:800 20px Inter;color:#1b2;background:rgba(255,255,255,.08)}
.ck.on{background:#ffd68c;color:#3a2a14}
.ck.x{border-color:#ff7a7a;color:#ff7a7a}
.cnt{position:absolute;top:150px;right:40px;display:flex;gap:12px}
.cnt i{width:46px;height:46px;border-radius:50%;border:3px solid rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;font:800 22px Taj;font-style:normal;background:rgba(20,24,38,.6)}
.cnt i.on{background:#ffd68c;color:#3a2a14;border-color:#ffd68c}
.cnt i.cur{background:#fff;color:#3a2a14;box-shadow:0 0 0 6px rgba(255,214,140,.45)}
.tag{position:absolute;transform:translate(-50%,-100%);background:rgba(255,250,240,.95);color:#3a2a14;font:800 22px Taj;padding:6px 16px 9px;border-radius:12px;white-space:nowrap;box-shadow:0 6px 16px rgba(0,0,0,.3)}
.tag::after{content:'';position:absolute;left:50%;bottom:-9px;margin-left:-9px;border:9px solid transparent;border-bottom:0;border-top-color:rgba(255,250,240,.95)}
.tag.me{background:#ffd68c}
.mm{position:absolute;bottom:40px;left:40px;width:210px;height:210px;border-radius:50%;background:rgba(20,24,38,.7);border:3px solid rgba(255,214,140,.6)}
.hint{position:absolute;bottom:250px;left:50%;transform:translateX(-50%);background:rgba(16,120,70,.88);color:#fff;font:700 24px Taj;padding:10px 24px 13px;border-radius:14px}
</style></head><body><div id="hud"></div>
<script type="importmap">{"imports":{"three":"./three/build/three.module.js","three/addons/":"./three/examples/jsm/"}}</script>
<script type="module" src="scene.js"></script></body></html>
